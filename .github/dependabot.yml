version: 2
updates:
  # Groups routine version-only bumps to avoid PR spam; security patches
  # always get their own PR regardless of grouping (Dependabot's own
  # documented behavior for security-update PRs).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
