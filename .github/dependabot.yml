version: 2
updates:
  # One grouped PR per ecosystem, monthly, to keep noise low on a project
  # in maintenance / handover mode. Security-update PRs are still opened
  # individually and immediately, regardless of this grouping (Dependabot's
  # own documented behaviour).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
